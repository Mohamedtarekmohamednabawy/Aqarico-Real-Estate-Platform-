    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Outfit:wght@100..900&display=swap"

    <meta http-equiv="Content-Security-Policy"

    <meta name="referrer" content="origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

        content="Aqarico is your premier destination for buying, selling, and renting properties. Find your dream home with our extensive listings and expert agents." />

    <!-- Twitter -->

        content="Aqarico is your premier destination for buying, selling, and renting properties. Find your dream home with our extensive listings and expert agents." />
    <meta property="twitter:image" content="/src/assets/house.ico" />

    <!-- Advanced SEO -->
    <link rel="canonical" href="https://aqarico.com" />
    <meta name="theme-color" content="#f97316" />
    <meta name="application-name" content="Aqarico" />
    <meta property="og:site_name" content="Aqarico" />
    <meta property="og:locale" content="en_US" />
    <link rel="apple-touch-icon" href="/src/assets/house.ico" />

    <meta name="geo.region" content="US" />

    <meta name="geo.position" content="37.0902;-95.7129" />
    <meta name="ICBM" content="37.0902, -95.7129" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "RealEstateAgent",
                "name": "Aqarico",
                "image": "https://aqarico.com/src/assets/house.ico",
                "@id": "https://aqarico.com",
                "url": "https://aqarico.com",
                "telephone": "+1234567890",
                "address": {
                    "@type": "PostalAddress",
                    "streetAddress": "123 Real Estate St",
                    "addressLocality": "City",
                    "postalCode": "12345",
                    "addressCountry": "US"
                },
                "priceRange": "$$$",
                "openingHoursSpecification": {
                    "@type": "OpeningHoursSpecification",
                    "dayOfWeek": [
                        "Monday",
                        "Tuesday",
                        "Wednesday",
                        "Thursday",
                        "Friday"
                    ],
                    "opens": "09:00",
                    "closes": "18:00"
                },
                "sameAs": [
                    "https://www.facebook.com/aqarico",
                    "https://www.twitter.com/aqarico",
                    "https://www.instagram.com/aqarico"
                ]
            }
        </script>
